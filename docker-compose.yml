services:
  backend:
    build:
      context: ./backend
    container_name: neurallens-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override the DB URL for Docker network
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/serviceAccountKey.json
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/neurallens
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/results:/app/results
      - ./backend/weights:/app/weights
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro

  db:
    image: postgres:15-alpine
    container_name: neurallens-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: neurallens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
