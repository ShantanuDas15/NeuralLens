name: CI

# Railway is configured to wait for this workflow ("Wait for CI") before it
# deploys a push to main, so a failing check here blocks the deploy.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      FIREBASE_PROJECT_ID: ci-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # opencv-python (non-headless) needs these shared libraries at import.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # Same order as backend/Dockerfile: basicsr's setup.py needs torch,
      # numpy and Cython installed before it runs.
      - name: Install build prerequisites
        run: |
          grep -E '^(--extra-index-url|torch==|torchvision==|numpy==|Cython==)' requirements.txt > build-prereqs.txt
          pip install -r build-prereqs.txt
          rm build-prereqs.txt

      - name: Install dependencies
        run: pip install --no-build-isolation -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  backend-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational until the first findings are triaged; remove
    # continue-on-error to make it a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --no-deps --disable-pip

  frontend:
    name: Frontend lint, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
