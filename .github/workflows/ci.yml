name: CI

# Railway is configured to wait for this workflow ("Wait for CI") before it
# deploys a push to main, so a failing check here blocks the deploy.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: new advisories appear without any push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      FIREBASE_PROJECT_ID: ci-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # opencv-python (non-headless) needs these shared libraries at import.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # Same order as backend/Dockerfile: basicsr's setup.py needs torch,
      # numpy and Cython installed before it runs.
      - name: Install build prerequisites
        run: |
          grep -E '^(--extra-index-url|torch==|torchvision==|numpy==|Cython==)' requirements.txt > build-prereqs.txt
          pip install -r build-prereqs.txt
          rm build-prereqs.txt

      - name: Install dependencies
        run: pip install --no-build-isolation -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  backend-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          # torch/torchvision "+cpu" builds are not on PyPI, so they cannot be audited.
          grep -v -E '^(torch|torchvision)==|^--extra-index-url' backend/requirements.txt > /tmp/req-audit.txt
          # PYSEC-2026-1215 (basicsr, CVE-2024-27763): needs an attacker-controlled
          # SLURM_NODELIST environment variable; that code path is unused and
          # upstream has no fix. Re-evaluate if basicsr is upgraded or replaced.
          pip-audit -r /tmp/req-audit.txt --no-deps --disable-pip --ignore-vuln PYSEC-2026-1215

  frontend:
    name: Frontend lint, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
